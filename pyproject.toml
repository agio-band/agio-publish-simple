[project]
name = "agio-publish-simple"
version = "0.0.7"
requires-python = ">=3.11"
dependencies = [
    "frame-stamp==0.1.10",
    "pyside6>=6.10.0",
]
license = "MIT"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"agio_publish_simple" = [
    "__agio__.yml",
    "resources/**"
]
