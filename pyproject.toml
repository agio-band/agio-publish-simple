[project]
name = "agio-publish-simple"
version = "0.0.18"
requires-python = ">=3.10"
license = "MIT"

dependencies = [
    "frame-stamp>=0.1.12",
    "pyside6>=6.10.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"agio_publish_simple" = [
    "__agio__.yml",
    "resources/**"
]
